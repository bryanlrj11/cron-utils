name: nba
on:
  schedule:
    - cron: "0 10,16 * * *"   # ~05-06h & 11-12h ET: after games finalize, then catch lagging tables
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill from YYYY-MM-DD (default: last 14 days)"
        required: false
concurrency: nba
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-nba.txt
      - env:
          COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
          SINCE: ${{ inputs.since }}
        run: python -u -m jobs.nba ${SINCE:+--since "$SINCE"}
