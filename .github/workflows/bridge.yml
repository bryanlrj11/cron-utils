name: bridge
on:
  workflow_run:
    workflows: ["nba"]
    types: [completed]
  workflow_dispatch:
    inputs:
      since:
        description: "Bridge games on/after this date (YYYY-MM-DD); default last 30 days"
        required: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -u -m jobs.bridge --commit ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}
        env:
          COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}

      # The bridge runs after every nba collection, several times a day; start
      # the day's predictions only once last night's games are final and bridged.
      - name: Check last night's games are in
        id: gate
        if: github.event_name == 'workflow_run'
        run: python -u -m jobs.inference_gate
        env:
          COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}

      # Start the prediction run in the app repo instead of waiting for its own
      # cron, which GitHub routinely starts hours late. Needs a fine-grained token
      # with Actions read/write on that repo; without one the cron still runs.
      - name: Start daily inference
        if: github.event_name == 'workflow_run' && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFERENCE_DISPATCH_TOKEN }}
          APP_REPO: bryanlrj11/advanced-nba-analytics-project
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::INFERENCE_DISPATCH_TOKEN is not set; daily inference waits for its own schedule"
            exit 0
          fi
          today=$(TZ=America/New_York date +%F)
          since=$(date -u -d "TZ=\"America/New_York\" $today 00:00" +%FT%TZ)
          runs=$(gh run list -R "$APP_REPO" -w daily-inference.yml --created ">=$since" \
            --limit 50 --json status,conclusion)
          started=$(jq '[.[] | select(.status != "completed" or .conclusion == "success")] | length' <<<"$runs")
          failed=$(jq '[.[] | select(.conclusion == "failure")] | length' <<<"$runs")
          if [ "$started" -gt 0 ]; then
            echo "::notice::Daily inference for $today is already running or done"
            exit 0
          fi
          if [ "$failed" -ge 2 ]; then
            echo "::warning::Daily inference failed $failed times for $today; not retrying again"
            exit 0
          fi
          gh workflow run daily-inference.yml -R "$APP_REPO" --ref main
