name: keepalive
# Scheduled workflows are disabled after 60 days without repo activity;
# re-enable them weekly.
on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for wf in odds-open.yml odds-close.yml boxscores.yml nba.yaml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}
